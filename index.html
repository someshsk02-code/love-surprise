<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Romantic Love Surprise</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#02030f;color:#fff;font-family:sans-serif}.stars,.hearts,.petals{position:fixed;inset:0;pointer-events:none}.star{position:absolute;width:2px;height:2px;background:#fff;animation:tw 2s infinite alternate}.moon{position:absolute;top:40px;right:40px;width:90px;height:90px;border-radius:50%;background:#eee;box-shadow:0 0 40px #fff}.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.butterfly{font-size:70px;cursor:pointer;animation:f 2s ease-in-out infinite}.hidden{display:none}.ring{font-size:90px;opacity:0;transform:scale(.2);transition:1.5s}.show{opacity:1;transform:scale(1)}#msg{font-size:2.2em;color:#ff8ad8;text-shadow:0 0 20px #ff66cc;opacity:0;transition:2s}@keyframes tw{to{opacity:.2}}@keyframes f{50%{transform:translateY(-10px)}}.heart,.petal{position:absolute;animation:fall linear forwards}</style></head><body><div class=stars></div><div class=moon></div><div class=hearts></div><div class=petals></div><div class=center id=s1><div class=butterfly>🦋</div><h2>Tap the Butterfly</h2></div><div class="center hidden" id=s2><div class=ring id=ring>💍</div><h1 id=msg>I Love You Forever ❤️</h1></div><script>
const st=document.querySelector('.stars');for(let i=0;i<180;i++){let d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=Math.random()*2+'s';st.appendChild(d);}
function spawn(c,e){let x=document.createElement('div');x.className=c;x.textContent=e;x.style.left=Math.random()*100+'%';x.style.top='-5%';x.style.position='absolute';x.style.animationDuration=3+Math.random()*4+'s';x.animate([{transform:'translateY(0)'},{transform:'translateY(110vh)'}],{duration:(3000+Math.random()*4000),iterations:1});document.querySelector(c=='heart'?'.hearts':'.petals').appendChild(x);setTimeout(()=>x.remove(),7000)}
setInterval(()=>spawn('heart','💖'),500);setInterval(()=>spawn('petal','🌹'),700);
document.querySelector('.butterfly').onclick=()=>{s1.classList.add('hidden');s2.classList.remove('hidden');setTimeout(()=>ring.classList.add('show'),200);setTimeout(()=>msg.style.opacity=1,1800);}
</script></body></html>
